[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetyl"
version = "0.2.0"
description = "Compile readable animations from motion constraints and verify their complete trajectories."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Nazeeh Abdul-Hadi"}]

[project.optional-dependencies]
render = ["manimgx==0.1.1"]

[project.urls]
Homepage = "https://nazeeh111.github.io/Kinetyl/"
Repository = "https://github.com/nazeeh111/Kinetyl"
Issues = "https://github.com/nazeeh111/Kinetyl/issues"

[project.scripts]
kinetyl = "kinetyl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinetyl = ["assets/*", "examples/*"]
